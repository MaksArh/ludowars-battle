version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ludowars-postgres
    environment:
      POSTGRES_USER: nakama
      POSTGRES_PASSWORD: localdb
      POSTGRES_DB: nakama
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakama"]
      interval: 5s
      timeout: 5s
      retries: 5

  nakama:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ludowars-nakama
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address nakama:localdb@postgres:5432/nakama?sslmode=disable &&
        exec /nakama/nakama --name nakama
        --database.address nakama:localdb@postgres:5432/nakama?sslmode=disable
        --logger.level DEBUG
        --session.token_expiry_sec 7200
        --socket.server_key "ludowars_dev_key"
        --runtime.path /nakama/data/modules
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7349:7349"
      - "7350:7350"
      - "7351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: ludowars-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_NAKAMA_HOST=localhost
      - VITE_NAKAMA_PORT=7350
      - VITE_NAKAMA_SERVER_KEY=ludowars_dev_key
    depends_on:
      - nakama

volumes:
  postgres_data:


